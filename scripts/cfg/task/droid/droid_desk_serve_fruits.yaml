task_name: droid_desk_serve_fruits
og_task_config:
  type: PickPlaceTask
  activity_name: ${task_name}
  semantic_group_mapping:
    robot: [agent]
    pear: [yellow_pear]
    apple: [red_apple]
    banana: [yellow_banana]
    orange: [orange_fruit, orange]            # both spellings: authored scenes say orange_fruit, the pipeline says orange
    orange_plate: [orange_square_plate]
    teal_plate: [teal_tray, teal_plate]       # ditto -- a group that binds nothing asserts on the first reset
  init_predicates_all: null
  init_predicates_any: null
  init_predicates_specific: null
  goal_predicates_all:
    - state: OnTop
      state_kwargs: null
      value: true
      group: banana
      other_group: teal_plate
    - state: OnTop
      state_kwargs: null
      value: true
      group: apple
      other_group: teal_plate
  goal_predicates_any:
    - state: Touching
      state_kwargs: null
      value: false
      group: robot
      other_group: banana
    - state: Touching
      state_kwargs: null
      value: false
      group: robot
      other_group: apple
  goal_predicates_specific: null
  # Milestone predicates - tracked during episode (once achieved, remembered)
  # Sequential: each milestone can only be checked if its prerequisites are satisfied
  milestone_predicates:
    - name: picked_banana
      state: IsGrasping
      state_kwargs: null
      value: true
      group: robot          # Check if robot is grasping
      other_group: banana     # the banana
      requires: []          # No prerequisites - can be achieved first
    - name: placed_banana_on_teal_plate
      state: OnTop
      state_kwargs: null
      value: true
      group: banana
      other_group: teal_plate
      requires: [] 
    - name: picked_apple
      state: IsGrasping
      state_kwargs: null
      value: true
      group: robot          # Check if robot is grasping
      other_group: apple     # the apple
      requires: []          # No prerequisites - can be achieved first
    - name: placed_apple_on_teal_plate
      state: OnTop
      state_kwargs: null
      value: true
      group: apple
      other_group: teal_plate
      requires: [] 
  robot_pose: null
  robot_xyz_randomization: null
  robot_z_rot_randomization: null
  # robot_joint_randomization: 0.174    # pi / 18
  robot_joint_randomization: null
  # ground_plane_z_offset: 0.02
  # ground_plane_z_randomization: 0.1 # +- 0.10m
  camera_look_at_point: null  # auto-inferred from camera ray-ground plane intersection
  # camera_randomization:
  #   delta_r: 0.05        # +/- 5cm distance variation
  #   delta_theta: 0.10    # +/- ~5.7 deg polar angle variation (radians)
  #   delta_phi: 0.10      # +/- ~5.7 deg azimuthal variation (radians)
  group_init_relative_poses: null
    # fruit: null [[0.65, 0.3023, 0.03], null]
    # plate: null [[0.7, -0.15, 0.04], null] #[[0.0, 0.0, 0.0], null]
  group_xyz_randomization:
    pear: [0.125, 0.125, 0]
    apple: [0.075, 0.075, 0]
    banana: [0.075, 0.075, 0]
    orange: [0.165, 0.11, 0]
    orange_plate: [0.05, 0.05, 0]
    teal_plate: [0.05, 0.05, 0]
  group_z_rot_randomization:
    pear: 0.174
    apple: 0.174
    banana: 0.174
    orange: 0.174
    orange_plate: 0.174
    teal_plate: 0.174
  group_predicate_placement:
    teal_plate:
      reference_group: banana
      predicates: [left_of, right_of, behind, in_front_of]
      gap:                              # per-predicate gap ranges
        left_of: [0.03, 0.05]
        right_of: [0.03, 0.05]
        behind: [0.02, 0.05]
        in_front_of: [0.01, 0.03]
      z_offset: 0.0
    orange_plate:
      reference_group: banana
      predicates: [left_of, right_of, behind, in_front_of]
      gap:                              # per-predicate gap ranges
        left_of: [0.03, 0.05]
        right_of: [0.03, 0.05]
        behind: [0.02, 0.05]
        in_front_of: [0.01, 0.03]
      z_offset: 0.0
  #   bowl:
  #     reference_group: plate
  #     predicates: [left_of, right_of, behind, in_front_of]
  #     gap:
  #       left_of: [0.03, 0.15]
  #       right_of: [0.03, 0.15]
  #       behind: [0.02, 0.05]
  #       in_front_of: [0.01, 0.03]
  #     z_offset: 0.0
  # Workspace limits in the robot base frame (metres). The task pulls non-robot objects
  # back into them on reset -- `randomize_object_pose` intersects the requested offset
  # range with them, and an object already outside gets an intersection that runs
  # *backwards*, so it is dragged toward the bounds every episode.
  #
  # y was the real defect: the props sit at y' -0.313..+0.192 and the old [-0.05, 0.05]
  # could not hold any of them, so pear/banana/orange were shifted 7-12 cm on every
  # unpinned reset. The published reference scene oversteps it too (teal_tray at y'
  # +0.282), so the band was too narrow for the task, not for this scene.
  #
  # x is capped at the arm's reach (~0.855 m): a "workspace limit" that admits a point the
  # arm cannot get to is a licence to fail. The reference scene's orange_square_plate
  # reconstructs at x' 0.900, i.e. already beyond it. Only pear/banana/apple/orange get
  # their *final* pose from this band -- orange_square_plate and teal_tray are re-placed
  # next to the banana afterwards by `group_predicate_placement`, which discards the
  # randomized pose. Measured over the 4 that this band does govern, the old band shifted
  # 3 of them 73-125 mm per reset; this one shifts none, and leaves 0.4% of placements
  # beyond reach instead of 1.4%. Pinned runs are unaffected either way.
  workspace_bounds:
    lower: [0.30, -0.35, -1.0]
    upper: [0.86, 0.25, 1.0]
  prevent_predicate_overlap: true
  overlap_separation_multiplier: 1.5
  # additional_objects: {}
  additional_objects: null
  # additional_objects:
  #   n: 3                              # max number of distractor objects per reset
  #   dataset_name: behavior-1k-assets  # dataset to pull from
  #   filters:                          # same syntax as query_assets
  #     - "volume < 0.001"
  #     - "mass < 2"
  #   category: null                    # category substring filter
  #   abilities: null                   # e.g. [openable]
  #   specific_assets: null             # explicit [{category: ..., model: ...}] list
  #   reference_group: plate            # place distractors around this object group
  #   placement_radius: 3.0            # max XY distance from reference object
  #   z_offset: 0.01                   # gap above support surface
  #   max_placement_attempts: 20       # retries per object to avoid collisions
  #   placement_bounds:              # XY limits in robot base frame (meters)
  #     lower: [0.3, -2.0]
  #     upper: [1.0, 2.0]
  termination_config:
    max_steps: 1000
  reward_config:
    r_potential: 1.0
  include_obs: false
  hdr_background_name: null